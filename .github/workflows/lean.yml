name: Lean proofs
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  formal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
      - name: Reject unfinished proof placeholders
        run: python3 tools/check_no_sorry.py
      - name: Run Lean demonstration
        run: lake exe catopt-demo
