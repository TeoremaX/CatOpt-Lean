name = "catopt"
version = "0.10.0"
defaultTargets = ["CatOpt", "catopt-demo", "catopt-certify"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
